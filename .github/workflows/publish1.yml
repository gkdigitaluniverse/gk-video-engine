name: publish1
on:
  push:
    paths: ["pub/**"]
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Verify the YouTube post
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_verify2.py > VERIFY1.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f VERIFY1.txt && git commit -m "publish1: verify" || true
          git pull --rebase -q origin main || true
          git push || true
