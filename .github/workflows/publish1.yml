name: publish1
on:
  workflow_dispatch:   # push trigger removed: it deleted the previous video's FB post by accident
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Take the video down
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_unpublish.py > UNPUB.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f UNPUB.txt && git commit -m "unpublish attempt" || true
          git pull --rebase -q origin main || true
          git push || true
