name: publish1
on:
  push:
    paths: ["pub/**"]
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Publish to all three
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
          VURL: "https://github.com/gkdigitaluniverse/gk-video-engine/releases/download/run1/final.mp4"
          IURL: "https://github.com/gkdigitaluniverse/gk-video-engine/releases/download/run1/thumb.png"
        run: python3 mcp_publish.py > PUBLISH1.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f PUBLISH1.txt && git commit -m "publish1: cloudflare video" || true
          git pull --rebase -q origin main || true
          git push || true
