name: fetch
on:
  push:
    paths: ["fetch/**"]
  workflow_dispatch:
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash getvoice.sh > VOICE.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f VOICE.txt voice.mp3 2>/dev/null || git add -f VOICE.txt
          git commit -m "run1: voice download" || true
          git pull --rebase -q origin main || true
          git push || true
