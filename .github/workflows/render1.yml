name: render1
on:
  push:
    paths: ["v1/**"]
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu
          pip install -q pillow playwright
          python -m playwright install --with-deps chromium
          mkdir -p v1/fonts
          curl -sL -o v1/fonts/Montserrat-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true
          ls -la v1/fonts/
      - name: Render
        working-directory: v1
        run: python render.py 2>&1 | tee RENDER.txt
      - name: Upload release asset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view run1 -R gkdigitaluniverse/gk-video-engine >/dev/null 2>&1 || \
            gh release create run1 -R gkdigitaluniverse/gk-video-engine --title "run1" --notes "cloudflare video"
          gh release upload run1 v1/video-noaudio.mp4 v1/thumb.png -R gkdigitaluniverse/gk-video-engine --clobber || true
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f v1/RENDER.txt v1/shots v1/thumb.png 2>/dev/null || git add -f v1/RENDER.txt
          git commit -m "render1: output" || true
          git pull --rebase -q origin main || true
          git push || true
