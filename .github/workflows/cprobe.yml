name: cprobe
on:
  push:
    paths: ["cprobe/**"]
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Buffer video capability test
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_buf3.py > BUFFER3.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f BUFFER3.txt && git commit -m "buffer: video capability" || true
          git pull --rebase -q origin main || true
          git push || true
