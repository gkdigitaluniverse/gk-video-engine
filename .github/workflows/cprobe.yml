name: cprobe
on:
  push:
    paths: ["cprobe/**"]
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Final complete test
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_final.py > FINALTEST.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f FINALTEST.txt && git commit -m "test: final complete" || true
          git pull --rebase -q origin main || true
          git push || true
