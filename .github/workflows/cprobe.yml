name: cprobe
on:
  push:
    paths: ["cprobe/**"]
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Publish the reel and test Facebook
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_pub.py > PUBLISH.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f PUBLISH.txt && git commit -m "test: publish reel + fb post" || true
          git pull --rebase -q origin main || true
          git push || true
