name: cprobe
on:
  push:
    paths: ["cprobe/**"]
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Buffer GraphQL introspection
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_gql.py > GQL.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f GQL.txt && git commit -m "buffer: graphql introspection" || true
          git pull --rebase -q origin main || true
          git push || true
