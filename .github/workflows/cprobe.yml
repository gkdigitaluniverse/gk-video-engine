name: cprobe
on:
  push:
    paths: ["cprobe/**"]
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Find the file staging route
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python3 mcp_full.py > FULL1.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f FULL1.txt && git commit -m "test: file staging route" || true
          git pull --rebase -q origin main || true
          git push || true
