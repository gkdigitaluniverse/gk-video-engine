name: cprobe
on:
  push:
    paths: ["cprobe/**"]
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Post a real test reel to Instagram
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
          VURL: ${{ vars.TEST_VIDEO_URL }}
        run: python3 mcp_post.py > POSTTEST.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f POSTTEST.txt && git commit -m "test: real instagram post" || true
          git pull --rebase -q origin main || true
          git push || true
