name: render
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Assets
        run: |
          mkdir -p public/assets public/fonts
          B=https://raw.githubusercontent.com/storytold/craft-anything/main
          curl -sL "$B/assets/app-icon/hicolor/256x256/apps/ai.storyteller.craft-anything.png" -o public/assets/craft_icon.png
          for n in make workbench project-website project-game; do curl -sL "$B/docs/images/$n.png" -o "public/assets/$n.png"; done
          for s in rust github claude ycombinator typescript python go; do curl -sL "https://cdn.jsdelivr.net/npm/simple-icons@13/icons/$s.svg" -o "public/assets/$s.svg"; done
          pip install --quiet cairosvg
          python3 -c "import cairosvg,glob;[cairosvg.svg2png(url=f,write_to=f[:-4]+'.png',output_width=512,output_height=512) for f in glob.glob('public/assets/*.svg')]"
          curl -sL "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Black.ttf" -o public/fonts/Montserrat-Black.ttf
          ls -la public/assets public/fonts

      - name: Live captures with Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const shots = [
              ['https://github.com/storytold/craft-anything', 'public/assets/live_repo.png', 1280, 1600],
              ['https://news.ycombinator.com/item', 'public/assets/live_hn.png', 1280, 1600],
            ];
            for (const [url, out, w, h] of shots) {
              try {
                const p = await b.newPage({ viewport: { width: w, height: h } });
                await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await p.waitForTimeout(2500);
                await p.screenshot({ path: out });
                console.log('shot', url, out);
                await p.close();
              } catch (e) { console.log('shot failed', url, String(e).slice(0,160)); }
            }
            await b.close();
          })();
          JS

      - name: Fallback assets
        run: |
          # fallback: never let a missing live shot kill the render
          for f in live_repo live_hn typescript python go; do
            [ -s "public/assets/$f.png" ] || cp public/assets/workbench.png "public/assets/$f.png"
          done
          ls -la public/assets

      - name: Render
        run: npx remotion render src/index.ts Craft out/craft-anything.mp4 --codec=h264 --crf=18 --concurrency=2

      - uses: actions/upload-artifact@v4
        with: { name: craft-anything, path: out/craft-anything.mp4, retention-days: 5 }
