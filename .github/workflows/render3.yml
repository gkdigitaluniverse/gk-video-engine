name: render3
on:
  push:
    paths: ["v5/**"]
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
          pip install -q pillow
          mkdir -p v5/fonts
          curl -sL -o v5/fonts/Montserrat-Bold.ttf "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf" || true
      - name: Fetch assets
        run: |
          cd v5 && mkdir -p rec frames
          B=https://github.com/gkdigitaluniverse/gk-video-engine/releases/download/run1
          curl -sL -o rec/play.mp4 $B/play.mp4
          curl -sL -o voice.wav $B/voice.wav
          curl -sL -o channel-bgm.mp3 $B/channel-bgm.mp3
          ffmpeg -y -v error -i rec/play.mp4 -vf fps=30 -q:v 3 frames/%06d.jpg
          ls frames | wc -l
      - name: Render v3
        working-directory: v5
        run: python render3.py 2>&1 | tee RENDER3.txt
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload run1 v5/video3.mp4 v5/thumb3.png v5/chk_a.png v5/chk_b.png v5/chk_c.png v5/chk_d.png v5/chk_e.png v5/chk_f.png -R gkdigitaluniverse/gk-video-engine --clobber || true
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f v5/RENDER3.txt v5/chk_*.png v5/thumb3.png 2>/dev/null || git add -f v5/RENDER3.txt
          git commit -m "render3: dashboard language" || true
          git pull --rebase -q origin main || true
          git push || true
