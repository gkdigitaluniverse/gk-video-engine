name: bufposts
on:
  push:
    paths: ["v12/**"]
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: python v12/buf_posts.py > v12/BUF2.txt 2>&1 || true
      - run: |
          git config user.email a@b && git config user.name a
          git add -A && git commit -qm "probe: buffer posts schema" || true
          git push || true
