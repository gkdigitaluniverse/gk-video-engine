name: composio-probe
on:
  push:
    paths:
      - "probe/**"
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Metricool report
        continue-on-error: true
        env:
          CK: "ck_ernrxI8ZCZomDrXJDAlX"
        run: |
          python3 MCP-SCRIPT.py > PROBE-RESULT.txt 2>&1 || true
          cat PROBE-RESULT.txt
      - name: Commit
        run: |
          ls -la PROBE-RESULT.txt || echo "none" > PROBE-RESULT.txt
          git config user.email ci@local && git config user.name ci
          git add -f PROBE-RESULT.txt MCP-SCRIPT.py && git commit -m "ci: metricool report" || true
          git push origin HEAD:probe/run1 || true
