name: composio-probe
on:
  push:
    paths:
      - "probe/**"
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        continue-on-error: true
        env:
          CK: "ck_ernrxI8ZCZomDrXJDAlX"
        run: |
          exec > PROBE-RESULT.txt 2>&1
          echo "RUNNER: $(date -u)"
          echo "=== toolkits ==="
          curl -s --max-time 40 -H "x-api-key: $CK" "https://backend.composio.dev/api/v3/toolkits?limit=1000" -o tk.json
          echo "bytes: $(wc -c < tk.json)"
          head -c 300 tk.json; echo
          echo "METRICOOL_MATCHES: $(grep -o -i metricool tk.json | wc -l)"
          echo "=== connected accounts ==="
          curl -s --max-time 40 -H "x-api-key: $CK" "https://backend.composio.dev/api/v3/connected_accounts?limit=50" -o ca.json
          echo "bytes: $(wc -c < ca.json)"; head -c 700 ca.json; echo
          echo "=== auth configs ==="
          curl -s --max-time 40 -H "x-api-key: $CK" "https://backend.composio.dev/api/v3/auth_configs?limit=50" -o ac.json
          echo "bytes: $(wc -c < ac.json)"; head -c 500 ac.json; echo
      - name: Commit result
        run: |
          ls -la PROBE-RESULT.txt || echo "no result file" > PROBE-RESULT.txt
          git config user.email ci@local && git config user.name ci
          git add -f PROBE-RESULT.txt
          git commit -m "ci: probe result" || echo "nothing to commit"
          git push
