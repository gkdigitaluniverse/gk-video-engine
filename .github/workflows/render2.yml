name: render2
on:
  push:
    paths: ["v3/**"]
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
          pip install -q pillow requests
          mkdir -p v3/fonts
          curl -sL -o v3/fonts/Montserrat-Bold.ttf "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf" || true
          ls -la v3/fonts/
      - name: Fetch the assets
        run: |
          cd v3 && mkdir -p rec
          B=https://github.com/gkdigitaluniverse/gk-video-engine/releases/download/run1
          curl -sL -o rec/play.mp4 $B/play.mp4
          curl -sL -o voice.wav $B/voice.wav
          curl -sL -o channel-bgm.mp3 $B/channel-bgm.mp3
          ls -la rec/play.mp4 voice.wav channel-bgm.mp3
      - name: Render v2
        working-directory: v3
        run: python render2.py 2>&1 | tee RENDER2.txt
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload run1 v3/video2.mp4 v3/thumb2.png v3/check_t1.png v3/check_t2.png v3/check_t3.png v3/check_t4.png -R gkdigitaluniverse/gk-video-engine --clobber || true
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f v3/RENDER2.txt v3/check_*.png v3/thumb2.png 2>/dev/null || git add -f v3/RENDER2.txt
          git commit -m "render2: layered motion" || true
          git pull --rebase -q origin main || true
          git push || true
