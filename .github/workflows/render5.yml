name: render5
on:
  push:
    paths: ["v7/**"]
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
          pip install -q pillow
          mkdir -p v7/fonts
          B=https://github.com/google/fonts/raw/main
          curl -sL -o v7/fonts/Anton-Regular.ttf "$B/ofl/anton/Anton-Regular.ttf" || true
          curl -sL -o v7/fonts/ArchivoBlack-Regular.ttf "$B/ofl/archivoblack/ArchivoBlack-Regular.ttf" || true
          curl -sL -o v7/fonts/SpaceMono-Bold.ttf "$B/ofl/spacemono/SpaceMono-Bold.ttf" || true
          ls -la v7/fonts/
      - name: Fetch assets
        run: |
          cd v7 && mkdir -p rec frames
          B=https://github.com/gkdigitaluniverse/gk-video-engine/releases/download/run1
          curl -sL -o rec/play.mp4 $B/play.mp4
          curl -sL -o voice.wav $B/voice.wav
          curl -sL -o channel-bgm.mp3 $B/channel-bgm.mp3
          ffmpeg -y -v error -i rec/play.mp4 -vf fps=30 -q:v 3 frames/%06d.jpg
          ls frames | wc -l
      - name: Render v5 L6
        working-directory: v7
        run: python render5.py 2>&1 | tee RENDER5.txt
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload run1 v7/video5.mp4 v7/thumb5.png v7/z_a.png v7/z_b.png v7/z_c.png v7/z_d.png v7/z_e.png v7/z_f.png v7/z_g.png -R gkdigitaluniverse/gk-video-engine --clobber || true
      - name: Commit
        if: always()
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f v7/RENDER5.txt v7/z_*.png v7/thumb5.png 2>/dev/null || git add -f v7/RENDER5.txt
          git commit -m "render5: L6 cream editorial" || true
          git pull --rebase -q origin main || true
          git push || true
